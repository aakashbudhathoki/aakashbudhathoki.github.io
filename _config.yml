# ─────────────────────────────────────────────────────────────────────────
# _config.yml — Jekyll site configuration
#
# IMPORTANT: Update `url` and `github_username` before deploying.
# ─────────────────────────────────────────────────────────────────────────

# Site identity
title:       Aakash Budhathoki
tagline:     Junior Systems Administrator
description: >-
  Junior System Administrator passionate about Linux environments and automation.
  Transforming academic theory into efficient IT operations through Python
  scripting, system monitoring, and robust infrastructure practices.

# Author info — used throughout the site
author:
  name:     Aakash Budhathoki
  email:    aakashbudhathoki10@gmail.com
  location: Pepsicola, Kathmandu, Nepal
  phone:    "+977 9863800583"

# ─────────────────────────────────────────────────────────────────────────
# UPDATE THESE before deploying to GitHub Pages
# ─────────────────────────────────────────────────────────────────────────
url:      "https://aakashbudhathoki.github.io"
baseurl:  ""

github_username:   aakashbudhathoki
linkedin_username: aakash-budhathoki
# ─────────────────────────────────────────────────────────────────────────

# Build settings
markdown:    kramdown
highlighter: rouge
permalink:   /blog/:year/:month/:day/:title/

kramdown:
  input:              GFM
  syntax_highlighter: rouge

# Sass/CSS compression
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

# Files to exclude from the build output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor/
