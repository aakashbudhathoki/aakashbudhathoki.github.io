<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager — Aakash Budhathoki</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "aakashbudhathoki/aakashbudhathoki.github.io",
          branch: "main",
          auth_type: "pkce",
          app_id: "Ov23lin5ryBetQTNekqK"
        },
        site_url: "https://budhathokiaakash.com.np",
        display_url: "https://budhathokiaakash.com.np",
        media_folder: "assets/images/blog",
        public_folder: "/assets/images/blog",
        collections: [
          {
            name: "posts",
            label: "Blog Posts",
            folder: "_posts",
            create: true,
            slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
            fields: [
              { label: "Layout", name: "layout", widget: "hidden", default: "post" },
              { label: "Title", name: "title", widget: "string" },
              { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false },
              { label: "Author", name: "author", widget: "string", default: "Aakash Budhathoki" },
              { label: "Tags", name: "tags", widget: "list", allow_add: true, default: [] },
              { label: "Excerpt", name: "excerpt", widget: "text", required: false },
              { label: "Body", name: "body", widget: "markdown" }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
