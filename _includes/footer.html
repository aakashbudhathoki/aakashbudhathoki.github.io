<footer class="footer">
  <div class="container footer__inner">

    <p class="footer__copy">
      &copy; <span id="year"></span>
      <a href="{{ '/' | relative_url }}">{{ site.author.name }}</a>.
      Built with <a href="https://jekyllrb.com" target="_blank" rel="noopener noreferrer">Jekyll</a>
      &amp; hosted on <a href="https://pages.github.com" target="_blank" rel="noopener noreferrer">GitHub Pages</a>.
    </p>

    <nav class="footer__links" aria-label="Footer links">
      <a href="mailto:{{ site.author.email }}">Email</a>
      <a href="https://github.com/{{ site.github_username }}"
         target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://linkedin.com/in/{{ site.linkedin_username }}"
         target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>

  </div>
</footer>
